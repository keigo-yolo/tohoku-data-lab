<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="580 275 165 325"
     role="img"
     aria-labelledby="title desc">
  <title id="title">東北6県データネットワークマップ</title>
  <desc id="desc">公的機関が公表する緯度経度を基準に、青森、盛岡、仙台、秋田、山形、福島を配置した東北データネットワーク。</desc>

  <defs>
    <linearGradient id="tohokuGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cf6ff"/>
      <stop offset="52%" stop-color="#168bff"/>
      <stop offset="100%" stop-color="#765bff"/>
    </linearGradient>
    <linearGradient id="tohokuFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35dcff" stop-opacity=".24"/>
      <stop offset="55%" stop-color="#167dff" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#725dff" stop-opacity=".23"/>
    </linearGradient>
    <linearGradient id="routeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62f5ff"/>
      <stop offset="48%" stop-color="#2ca8ff"/>
      <stop offset="100%" stop-color="#795fff"/>
    </linearGradient>
    <filter id="mapGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="routeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-250%" y="-250%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .route {
      fill:none;
      stroke:url(#routeGradient);
      stroke-width:.82;
      stroke-linecap:round;
      stroke-dasharray:3.2 3.8;
      opacity:.64;
      filter:url(#routeGlow);
      animation:data-flow 5.5s linear infinite;
    }
    .route.secondary {
      opacity:.38;
      stroke-width:.62;
      animation-duration:7.5s;
      animation-direction:reverse;
    }
    .city-halo {
      fill:none;
      stroke:#63efff;
      stroke-width:.62;
      opacity:.42;
      transform-box:fill-box;
      transform-origin:center;
      animation:halo-pulse 2.8s ease-in-out infinite;
    }
    .city-core {
      fill:#d7fdff;
      stroke:#168cff;
      stroke-width:1.35;
      filter:url(#nodeGlow);
      transform-box:fill-box;
      transform-origin:center;
      animation:node-pulse 2.8s ease-in-out infinite;
    }
    .city-label {
      fill:#bfefff;
      font-family:Arial,"Helvetica Neue",sans-serif;
      font-size:4.1px;
      font-weight:700;
      letter-spacing:.55px;
      paint-order:stroke;
      stroke:#06101d;
      stroke-width:1.1px;
      stroke-opacity:.9;
    }
    .city-label.sub {
      fill:#64869d;
      font-size:2.5px;
      font-weight:600;
      letter-spacing:.35px;
    }
    @keyframes data-flow { to { stroke-dashoffset:-28; } }
    @keyframes node-pulse {
      0%,100% { transform:scale(1);opacity:1; }
      50% { transform:scale(1.22);opacity:.82; }
    }
    @keyframes halo-pulse {
      0%,100% { transform:scale(.72);opacity:.18; }
      50% { transform:scale(1.65);opacity:.52; }
    }
    @media (prefers-reduced-motion:reduce) {
      .route,.city-core,.city-halo { animation:none; }
    }
  </style>

  <!-- 東北6県 -->
  <g fill="url(#tohokuFill)" stroke="url(#tohokuGradient)"
     stroke-width="1.65" stroke-linejoin="round" filter="url(#mapGlow)">
    <polygon transform="translate(624 287)"
      points="3 71 3 63 0 60 6 51 12 51 18 47 21 31 17 27 20 26 21 19 27 23 31 20 35 23 37 38 40 45 46 41 45 37 47 33 58 42 61 39 65 23 61 16 55 22 41 25 47 0 64 11 73 6 71 37 73 51 77 62 81 61 86 67 80 74 75 72 71 75 69 72 56 82 52 81 53 70 48 70 48 65 38 72 35 70 32 72 25 67 22 70 10 68 7 72"/>
    <polygon transform="translate(617 352)"
      points="54 97 47 102 43 101 39 100 37 95 23 92 19 87 9 88 11 78 16 69 17 47 11 39 3 42 0 33 6 36 12 28 15 19 15 11 10 6 14 7 17 3 29 5 32 2 39 7 42 5 45 7 55 0 55 5 60 5 59 16 55 21 57 39 52 40 55 44 52 48 54 53 50 59 47 70 55 83 52 86 55 91"/>
    <polygon transform="translate(664 354)"
      points="48 92 41 91 39 105 33 102 29 107 23 103 25 99 17 100 7 95 8 89 5 84 8 81 0 68 3 57 7 51 5 46 8 42 5 38 10 37 8 19 12 14 16 15 29 5 31 8 35 5 40 7 46 0 54 11 52 16 57 19 55 23 61 28 64 43 62 53 65 49 66 54 68 55 62 60 64 62 67 59 67 63 63 63 63 68 60 69 65 68 60 71 62 73 60 75 64 74 58 81 62 83 57 83 60 86 57 86 59 88 53 89 52 86 54 91 52 91 52 94 50 90"/>
    <polygon transform="translate(612 439)"
      points="14 1 24 0 28 5 42 8 44 13 48 14 53 22 51 30 48 30 52 41 45 53 46 59 43 65 36 67 37 72 36 81 38 82 35 86 29 87 26 85 22 86 20 82 14 83 7 81 4 76 7 68 7 60 15 57 17 53 8 47 8 40 0 37 13 14"/>
    <path transform="translate(648 445)"
      d="M33 70 L29 70 L29 76 L25 76 L26 78 L21 76 L20 70 L11 70 L7 66 L1 66 L0 61 L7 59 L10 53 L9 47 L16 35 L12 24 L15 24 L17 16 L12 8 L16 9 L23 4 L33 9 L41 8 L39 12 L45 16 L49 11 L55 14 L57 0 L64 1 L67 8 L62 5 L63 10 L59 14 L62 19 L60 17 L56 20 L60 22 L57 28 L61 28 L61 32 L58 30 L60 34 L57 35 L58 38 L61 37 L59 39 L61 41 L61 45 L57 43 L58 40 L55 41 L57 39 L56 37 L39 40 L36 43 L40 45 L35 46 L38 47 L32 57 L33 70 Z M43 41 L44 43 L42 43 Z"/>
    <polygon transform="translate(594 511)"
      points="82 69 72 64 72 68 66 74 56 65 55 59 49 55 37 52 12 68 4 66 5 52 0 47 4 41 2 37 3 34 12 33 13 30 21 30 19 21 28 11 25 9 32 11 38 10 40 14 44 13 47 15 53 14 56 10 54 9 55 0 61 0 65 4 74 4 75 10 80 12 79 10 83 10 83 4 87 4 93 18 93 45 91 61"/>
  </g>


  <g class="data-routes" aria-hidden="true">
    <!-- Pacific / eastern axis -->
    <path class="route" d="M669.4 332.14 C677.4 355.14, 684.37 381.88, 688.37 400.88"/>
    <path class="route" d="M688.37 400.88 C687.37 430.88, 677.18 459.97, 675.18 488.97"/>
    <path class="route" d="M675.18 488.97 C670.18 500.97, 661.35 509.24, 656.35 520.24"/>

    <!-- Sea of Japan / western axis -->
    <path class="route" d="M669.4 332.14 C656.4 353.14, 642.75 379.64, 638.75 399.64"/>
    <path class="route" d="M638.75 399.64 C640.75 431.64, 646.43 462.13, 650.43 490.13"/>
    <path class="route" d="M650.43 490.13 C652.43 502.13, 653.35 510.24, 656.35 520.24"/>

    <!-- East-west links -->
    <path class="route secondary" d="M638.75 399.64 C655.75 395.64, 671.37 396.88, 688.37 400.88"/>
    <path class="route secondary" d="M650.43 490.13 C659.43 485.13, 666.18 483.97, 675.18 488.97"/>
  </g>


  <g id="city-nodes">

    <g class="city-node" data-city="aomori" data-lat="40.816667" data-lon="140.750000">
      <circle class="city-halo" cx="669.4" cy="332.14" r="5.7"/>
      <circle class="city-core" cx="669.4" cy="332.14" r="2.5"/>
      <text class="city-label" text-anchor="start" x="676.4" y="329.14">AOMORI</text>
      <text class="city-label sub" text-anchor="start" x="676.4" y="333.34">青森</text>
    </g>

    <g class="city-node" data-city="akita" data-lat="39.720000" data-lon="140.103611">
      <circle class="city-halo" cx="638.75" cy="399.64" r="5.7"/>
      <circle class="city-core" cx="638.75" cy="399.64" r="2.5"/>
      <text class="city-label" text-anchor="end" x="631.75" y="396.64">AKITA</text>
      <text class="city-label sub" text-anchor="end" x="631.75" y="400.84">秋田</text>
    </g>

    <g class="city-node" data-city="morioka" data-lat="39.700000" data-lon="141.150000">
      <circle class="city-halo" cx="688.37" cy="400.88" r="5.7"/>
      <circle class="city-core" cx="688.37" cy="400.88" r="2.5"/>
      <text class="city-label" text-anchor="start" x="695.37" y="397.88">MORIOKA</text>
      <text class="city-label sub" text-anchor="start" x="695.37" y="402.08">盛岡</text>
    </g>

    <g class="city-node" data-city="yamagata" data-lat="38.250000" data-lon="140.350000">
      <circle class="city-halo" cx="650.43" cy="490.13" r="5.7"/>
      <circle class="city-core" cx="650.43" cy="490.13" r="2.5"/>
      <text class="city-label" text-anchor="end" x="643.43" y="487.13">YAMAGATA</text>
      <text class="city-label sub" text-anchor="end" x="643.43" y="491.33">山形</text>
    </g>

    <g class="city-node" data-city="sendai" data-lat="38.268889" data-lon="140.871944">
      <circle class="city-halo" cx="675.18" cy="488.97" r="5.7"/>
      <circle class="city-core" cx="675.18" cy="488.97" r="2.5"/>
      <text class="city-label" text-anchor="start" x="682.18" y="485.97">SENDAI</text>
      <text class="city-label sub" text-anchor="start" x="682.18" y="490.17">仙台</text>
    </g>

    <g class="city-node" data-city="fukushima" data-lat="37.760833" data-lon="140.474722">
      <circle class="city-halo" cx="656.35" cy="520.24" r="5.7"/>
      <circle class="city-core" cx="656.35" cy="520.24" r="2.5"/>
      <text class="city-label" text-anchor="start" x="663.35" y="526.24">FUKUSHIMA</text>
      <text class="city-label sub" text-anchor="start" x="663.35" y="530.44">福島</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="580 275 165 325" role="img" aria-labelledby="title desc">
  <title id="title">東北6県デジタルマップ</title>
  <desc id="desc">青森県、岩手県、宮城県、秋田県、山形県、福島県の輪郭を表現した近未来的な地図</desc>

  <defs>
    <linearGradient id="tohokuGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cf6ff"/>
      <stop offset="52%" stop-color="#168bff"/>
      <stop offset="100%" stop-color="#765bff"/>
    </linearGradient>

    <linearGradient id="tohokuFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35dcff" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#167dff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#725dff" stop-opacity=".24"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Accurate prefectural outlines -->
  <g class="real-tohoku-prefectures"
     fill="url(#tohokuFill)"
     stroke="url(#tohokuGradient)"
     stroke-width="1.65"
     stroke-linejoin="round"
     filter="url(#glow)">

    <!-- Aomori / 青森 -->
    <polygon transform="translate(624 287)"
      points="3 71 3 63 0 60 6 51 12 51 18 47 21 31 17 27 20 26 21 19 27 23 31 20 35 23 37 38 40 45 46 41 45 37 47 33 58 42 61 39 65 23 61 16 55 22 41 25 47 0 64 11 73 6 71 37 73 51 77 62 81 61 86 67 80 74 75 72 71 75 69 72 56 82 52 81 53 70 48 70 48 65 38 72 35 70 32 72 25 67 22 70 10 68 7 72"/>

    <!-- Akita / 秋田 -->
    <polygon transform="translate(617 352)"
      points="54 97 47 102 43 101 39 100 37 95 23 92 19 87 9 88 11 78 16 69 17 47 11 39 3 42 0 33 6 36 12 28 15 19 15 11 10 6 14 7 17 3 29 5 32 2 39 7 42 5 45 7 55 0 55 5 60 5 59 16 55 21 57 39 52 40 55 44 52 48 54 53 50 59 47 70 55 83 52 86 55 91"/>

    <!-- Iwate / 岩手 -->
    <polygon transform="translate(664 354)"
      points="48 92 41 91 39 105 33 102 29 107 23 103 25 99 17 100 7 95 8 89 5 84 8 81 0 68 3 57 7 51 5 46 8 42 5 38 10 37 8 19 12 14 16 15 29 5 31 8 35 5 40 7 46 0 54 11 52 16 57 19 55 23 61 28 64 43 62 53 65 49 66 54 68 55 62 60 64 62 67 59 67 63 63 63 63 68 60 69 65 68 60 71 62 73 60 75 64 74 58 81 62 83 57 83 60 86 57 86 59 88 53 89 52 86 54 91 52 91 52 94 50 90"/>

    <!-- Yamagata / 山形 -->
    <polygon transform="translate(612 439)"
      points="14 1 24 0 28 5 42 8 44 13 48 14 53 22 51 30 48 30 52 41 45 53 46 59 43 65 36 67 37 72 36 81 38 82 35 86 29 87 26 85 22 86 20 82 14 83 7 81 4 76 7 68 7 60 15 57 17 53 8 47 8 40 0 37 13 14"/>

    <!-- Miyagi / 宮城 -->
    <path transform="translate(648 445)"
      d="M33 70 L29 70 L29 76 L25 76 L26 78 L21 76 L20 70 L11 70 L7 66 L1 66 L0 61 L7 59 L10 53 L9 47 L16 35 L12 24 L15 24 L17 16 L12 8 L16 9 L23 4 L33 9 L41 8 L39 12 L45 16 L49 11 L55 14 L57 0 L64 1 L67 8 L62 5 L63 10 L59 14 L62 19 L60 17 L56 20 L60 22 L57 28 L61 28 L61 32 L58 30 L60 34 L57 35 L58 38 L61 37 L59 39 L61 41 L61 45 L57 43 L58 40 L55 41 L57 39 L56 37 L39 40 L36 43 L40 45 L35 46 L38 47 L32 57 L33 70 Z M43 41 L44 43 L42 43 Z"/>

    <!-- Fukushima / 福島 -->
    <polygon transform="translate(594 511)"
      points="82 69 72 64 72 68 66 74 56 65 55 59 49 55 37 52 12 68 4 66 5 52 0 47 4 41 2 37 3 34 12 33 13 30 21 30 19 21 28 11 25 9 32 11 38 10 40 14 44 13 47 15 53 14 56 10 54 9 55 0 61 0 65 4 74 4 75 10 80 12 79 10 83 10 83 4 87 4 93 18 93 45 91 61"/>
  </g>

  <!-- Data-network overlay -->
  <g fill="none" stroke="#59efff" stroke-width=".8" stroke-opacity=".52" stroke-dasharray="4 4">
    <path d="M665 330 C660 370 665 402 660 445 C655 488 640 530 645 560"/>
    <path d="M653 399 C670 410 686 420 699 410"/>
    <path d="M640 472 C659 480 674 490 690 501"/>
    <path d="M643 556 C646 520 638 495 631 474"/>
  </g>

  <!-- Data nodes -->
  <g filter="url(#nodeGlow)">
    <circle cx="665" cy="330" r="4" fill="#a8fbff" stroke="#198cff" stroke-width="1.8"/>
    <circle cx="651" cy="398" r="3.8" fill="#9bf9ff" stroke="#198cff" stroke-width="1.8"/>
    <circle cx="699" cy="399" r="4.2" fill="#9bf9ff" stroke="#198cff" stroke-width="1.8"/>
    <circle cx="632" cy="474" r="4" fill="#9bf9ff" stroke="#198cff" stroke-width="1.8"/>
    <circle cx="684" cy="493" r="4.2" fill="#9bf9ff" stroke="#198cff" stroke-width="1.8"/>
    <circle cx="645" cy="559" r="4.2" fill="#a8fbff" stroke="#198cff" stroke-width="1.8"/>
  </g>
</svg>
